services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/app/data/plague.db
      - PRIZE_KEYPAIR=/app/secrets/prize-keypair.json
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_DOMAIN=${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  caddy_data:
